# ═══════════════════════════════════════════════════════════════════
# Llama2-7B 模型覆盖配置
# 仅包含与 default.yaml 不同的参数，其余继承默认值
# 参数来源: MSE-Adapter-Expend/MSE-Llama2-7B
# ═══════════════════════════════════════════════════════════════════

common:
  pretrain_LM: /root/autodl-tmp/models/Meta/Llama-2-7b-hf/
  lora_target_modules: q_proj,v_proj

classification:
  meld:
    # Llama2 用 "Assistant:" 风格 prompt
    task_specific_prompt: >-
      Please recognize the emotion of the above multimodal content from the
      target set <neutral:0, surprise:1, fear:2, sadness:3, joy:4, disgust:5, anger:6>. Assistant: The emotion is
    max_new_tokens: 2
    pseudo_tokens: 4
    batch_size: 6
    learning_rate: 5.0e-4
    a_lstm_hidden_size: 64
    v_lstm_hidden_size: 32
    warm_up_epochs: 30

  iemocap:
    task_specific_prompt: >-
      Please recognize the emotion of the above multimodal content from the target
      set <angry:0, happy:1, sad:2, neutral:3>. Assistant: The emotion is
    task_specific_prompt_6class: >-
      Please recognize the emotion of the above multimodal content from the target
      set <angry:0, happy:1, excited:2, sad:3, neutral:4, frustrated:5>. Assistant: The emotion is
    batch_size: 8
    learning_rate: 5.0e-5

  cherma:
    task_specific_prompt: >-
      请选择适用于上述多模态内容的情绪标签：<愤怒:0, 厌恶:1, 恐惧:2, 高兴:3, 平静:4, 悲伤:5, 惊奇:6>。助手: 情绪为
    batch_size: 6

regression:
  mosei:
    task_specific_prompt: >-
      Please predict the sentiment intensity of the above multimodal content in the range [-3.0, +3.0]. Assistant: The sentiment is
    batch_size: 8

  simsv2:
    batch_size: 8
    warm_up_epochs: 40
